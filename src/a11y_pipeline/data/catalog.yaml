# Catalogo dei 55 criteri di successo WCAG 2.2 di livello A e AA.
#
# Campi:
#   id        numero del criterio (WCAG 2.2, https://www.w3.org/TR/WCAG22/)
#   title     titolo ufficiale in inglese, come nel testo W3C
#   level     A o AA
#   since     versione WCAG in cui il criterio è stato introdotto (2.0, 2.1, 2.2)
#   tier      classificazione di questo progetto (non W3C) sulla verificabilità automatica:
#               1 = esistono regole ACT implementate in modo coerente da strumenti automatici
#                   (controllo automatico, ma solo di alcuni aspetti del criterio)
#               2 = esistono regole ACT, ma serve giudizio umano o euristiche
#               3 = nessuna regola ACT: il criterio non è verificabile in automatico
#             Fonti: https://www.w3.org/WAI/standards-guidelines/act/rules/ e le pagine di
#             implementazione di Alfa, axe-core, UsableNet AQA e webmate (novembre 2026).
#
# Le clausole EN 301 549 si ricavano dal numero del criterio (9.<id>), vedi catalog.py:
#   - EN 301 549 v3.2.1 (armonizzata, riferimento di legge oggi): solo i criteri WCAG 2.0 e 2.1
#   - EN 301 549 v4.1.1 (pubblicata a settembre 2026, non ancora citata in GUUE): tutti i 55
#
# I titoli sono tratti da "Web Content Accessibility Guidelines (WCAG) 2.2",
# W3C Recommendation, https://www.w3.org/TR/WCAG22/ — W3C Document License.
# I campi tier e since, e la mappatura EN 301 549, sono aggiunte di questo progetto.

