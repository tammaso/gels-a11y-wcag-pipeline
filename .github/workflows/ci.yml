name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Ogni lunedì alle 05:17 UTC: regressione completa sui test case ACT del W3C
    - cron: "17 5 * * 1"

jobs:
  test:
    name: Test (unit + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Motori JavaScript (versioni fissate in package-lock.json)
        run: npm ci
      - name: Dipendenze Python
        run: pip install -e ".[dev]"
      - name: Browser per Playwright
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: pytest -m "not act"

  act-regression:
    name: Regressione sui test case ACT (W3C)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Test case ACT
        run: pytest -m act
      - name: Riepilogo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act-summary
          path: reports/act-summary.json
